<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="tiempo">
        <input type="text" class="inputCiudad" placeholder="Introduzca una ciudad">
        <button type="submit">Obtener tiempo</button>
    </form>

    <div class="cuadro">
        <h1 class="ciudad">Venezuela</h1>
        <p class="temperatura">67ºC</p>
        <p class="humedad">Humedad: 67%</p>
        <p class="descripcion">Cielos cocinados</p>
        <p class="simboloTiempo">⛅️</p>
        <p class="error">Por favor introduce una ciudad</p>
    </div>
   
    <script src="index.js"></script>
</body>
</html>
